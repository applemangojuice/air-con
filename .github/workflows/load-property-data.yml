name: Load property data

# Loads the property database in bulk, so the quote form and the price check
# already know every home in your area: no outside call when a customer
# types their postcode or picks their home. Runs on GitHub; nothing on your
# machine.
#
# Sources:
#   - epc-bulk (default): the EPC register's national file of every domestic
#                certificate in England and Wales, streamed and kept to your
#                OUTCODES. The whole area in one go (about 10-20 minutes).
#   - file-url:  a file you were sent, e.g. a council download from the EPC
#                website (Download data → filter by local authority; the link
#                arrives by email). Paste the link in "file_url".
#   - epc-api:   just some postcodes ("postcodes"), or councils' new
#                certificates since a date. What the weekly run uses.
#   - sample:    the made-up SW16/SW17 sample book (no EPC token needed).
#
# After the EPC import, every home gets its postcode centre (postcodes.io, 100
# postcodes a request) and its planning constraints (planning.data.gov.uk:
# conservation areas, Article 4 and listed outlines fetched once per outcode
# and matched locally), then archetypes and priority scores are recomputed.
#
# One-time setup (all in the browser):
#   1. Supabase project with supabase/migrations/ applied (SQL editor).
#   2. Repo → Settings → Secrets and variables → Actions → New repository secret:
#        SUPABASE_URL                = https://YOUR-PROJECT.supabase.co
#        SUPABASE_SERVICE_ROLE_KEY   = Supabase → Settings → API → service_role
#        EPC_BEARER_TOKEN            = your API token from
#                                      https://get-energy-performance-data.communities.gov.uk/
#      (the old EPC_API_EMAIL / EPC_API_KEY secrets no longer work: delete them)
#
# First run: source epc-bulk with your outcodes. After that the Monday run
# keeps it topped up with new certificates. See docs/loading-data.md.

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Data source"
        type: choice
        options:
          - epc-bulk
          - file-url
          - epc-api
          - sample
        default: epc-bulk
      outcodes:
        description: "Outcodes to keep (default: the whole service area)"
        type: string
        default: "SW2,SW4,SW11,SW12,SW16,SW17,SW18,SW19,SE19,SE25,SE27,CR0,CR2,CR4,CR7,CR8,E3"
      file_url:
        description: "file-url only: the link to the .zip or .csv"
        type: string
        default: ""
      postcodes:
        description: "epc-api only: just these postcodes, comma separated. Empty = councils below"
        type: string
        default: ""
      councils:
        description: "epc-api only: council names as the register spells them"
        type: string
        default: "Lambeth,Wandsworth,Merton,Croydon"
      since:
        description: "epc-api councils only: certificates lodged since YYYY-MM (empty = all history)"
        type: string
        default: ""
      recompute:
        description: "Add locations and planning constraints, then recompute archetypes + priority"
        type: boolean
        default: true

  # Weekly: the councils' newly lodged certificates (a new EPC often means a
  # sale or a renovation), then locations, constraints and scores for them.
  schedule:
    - cron: "0 6 * * 1" # 06:00 UTC every Monday

# Never let two loads write the same database at once.
concurrency:
  group: load-property-data
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      EPC_BEARER_TOKEN: ${{ secrets.EPC_BEARER_TOKEN }}
      SOURCE: ${{ github.event_name == 'schedule' && 'epc-api' || inputs.source }}
      OUTCODES: ${{ inputs.outcodes || 'SW2,SW4,SW11,SW12,SW16,SW17,SW18,SW19,SE19,SE25,SE27,CR0,CR2,CR4,CR7,CR8,E3' }}
      FILE_URL: ${{ inputs.file_url || '' }}
      COUNCILS: ${{ inputs.councils || 'Lambeth,Wandsworth,Merton,Croydon' }}
      POSTCODES: ${{ inputs.postcodes || '' }}
    steps:
      - name: Check required secrets
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "::error::Missing repo secrets SUPABASE_URL and/or SUPABASE_SERVICE_ROLE_KEY."
            echo "Add them under Settings → Secrets and variables → Actions (values: Supabase → Settings → API)."
            exit 1
          fi
          if { [ "$SOURCE" = "epc-bulk" ] || [ "$SOURCE" = "epc-api" ]; } && [ -z "$EPC_BEARER_TOKEN" ]; then
            echo "::error::Source is $SOURCE but the EPC_BEARER_TOKEN secret is missing."
            echo "Register free at https://get-energy-performance-data.communities.gov.uk/ and add your API token, or run with source=sample."
            exit 1
          fi
          if [ "$SOURCE" = "file-url" ] && [ -z "$FILE_URL" ]; then
            echo "::error::Source is file-url but no file_url was given."
            exit 1
          fi
          echo "Secrets OK for source=$SOURCE."

      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ---- source: epc-bulk / file-url (whole areas from one file) ----
      - name: Read the bulk EPC file
        if: ${{ env.SOURCE == 'epc-bulk' || env.SOURCE == 'file-url' }}
        working-directory: apps/web
        run: |
          if [ "$SOURCE" = "epc-bulk" ]; then
            node --experimental-strip-types scripts/bulk-epc.mjs --national --outcodes "$OUTCODES" --out scripts/data/epc-certificates.csv
          else
            node --experimental-strip-types scripts/bulk-epc.mjs --file "$FILE_URL" --outcodes "$OUTCODES" --out scripts/data/epc-certificates.csv
          fi

      - name: Import EPC (bulk)
        if: ${{ env.SOURCE == 'epc-bulk' || env.SOURCE == 'file-url' }}
        working-directory: apps/web
        run: node scripts/import-intel.mjs epc scripts/data/epc-certificates.csv --outcodes "$OUTCODES" --no-log

      # ---- source: epc-api (some postcodes, or new certificates) ----
      # Scheduled runs get the last 8 days (a day's overlap); manual runs use "since".
      - name: Resolve "since"
        if: ${{ env.SOURCE == 'epc-api' }}
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "SINCE=$(date -u -d "8 days ago" +%Y-%m-%d)" >> "$GITHUB_ENV"
          else
            echo "SINCE=${{ inputs.since }}" >> "$GITHUB_ENV"
          fi

      - name: Fetch EPC certificates
        if: ${{ env.SOURCE == 'epc-api' }}
        working-directory: apps/web
        run: |
          if [ -n "$POSTCODES" ]; then
            node --experimental-strip-types scripts/fetch-epc.mjs \
              --postcodes "$POSTCODES" \
              --out scripts/data/epc-certificates.csv
          else
            node --experimental-strip-types scripts/fetch-epc.mjs \
              --council "$COUNCILS" \
              --outcodes "$OUTCODES" \
              ${SINCE:+--since "$SINCE"} \
              --out scripts/data/epc-certificates.csv
          fi

      - name: Import EPC (api)
        if: ${{ env.SOURCE == 'epc-api' }}
        working-directory: apps/web
        # Named postcodes are kept whatever their outcode; council loads keep OUTCODES only.
        run: |
          if [ -n "$POSTCODES" ]; then
            node scripts/import-intel.mjs epc scripts/data/epc-certificates.csv
          else
            node scripts/import-intel.mjs epc scripts/data/epc-certificates.csv --outcodes "$OUTCODES"
          fi

      # ---- source: sample (no EPC key) ----
      - name: Generate + import sample data
        if: ${{ env.SOURCE == 'sample' }}
        working-directory: apps/web
        run: |
          node scripts/make-sample-data.mjs
          node scripts/import-intel.mjs epc scripts/sample-data/epc-certificates.csv --outcodes SW16,SW17
          node scripts/import-intel.mjs planning scripts/sample-data/planning.csv --outcodes SW16,SW17
          node scripts/import-intel.mjs constraints scripts/sample-data/constraints.csv

      # ---- shared: locations, planning constraints, scores ----
      # Not for the made-up sample homes: their postcodes are real places.
      - name: Add locations and planning constraints
        if: ${{ env.SOURCE != 'sample' && (github.event_name != 'workflow_dispatch' || inputs.recompute) }}
        working-directory: apps/web
        run: node --experimental-strip-types scripts/enrich-intel.mjs

      - name: Recompute archetypes + priority scores
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.recompute }}
        working-directory: apps/web
        run: node --experimental-strip-types scripts/recompute-intel.mjs

      - name: Summary
        if: ${{ always() }}
        run: |
          {
            echo "### Property data load"
            echo ""
            echo "- Source: \`$SOURCE\`"
            echo "- Outcodes kept: \`$OUTCODES\`"
            [ "$SOURCE" = "file-url" ] && echo "- File: a link you provided"
            [ "$SOURCE" = "epc-api" ] && [ -z "$POSTCODES" ] && echo "- Councils: \`$COUNCILS\`, since \`${SINCE:-all history}\`"
            [ -n "$POSTCODES" ] && echo "- Postcodes: \`$POSTCODES\`"
            echo ""
            echo "Open \`/ops/status\` to confirm the tables are healthy and \`/ops/intel\` to see the book."
          } >> "$GITHUB_STEP_SUMMARY"
